<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login | Greater Works Parish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(190deg, var(--royal-blue-dark), var(--royal-blue)); padding:24px; }
  .admin-box { background:#fff; border-radius:20px; padding:40px 32px; max-width:400px; width:100%; box-shadow:0 24px 60px rgba(0,0,0,.25); }
  .admin-box h1 { font-size:1.6rem; text-align:center; margin-bottom:6px; }
  .admin-box p.sub { text-align:center; color:#5C6660; margin-bottom:28px; font-size:.95rem; }
  .admin-error { background:#FDEDED; color:var(--crimson); border-radius:10px; padding:12px 16px; font-size:.9rem; margin-top:16px; display:none; }
</style>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-box">
    <h1>Parish Admin</h1>
    <p class="sub">Greater Works Parish — Pastor access only</p>

    <form id="loginForm" class="form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn-gold" style="width:100%; margin-top:24px;">Log In</button>
      <div class="admin-error" id="errorBox"></div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // Only this email is allowed to access the church admin dashboard —
  // even though it shares the same Firebase project as What's Your Dream.
  const ALLOWED_ADMIN_EMAIL = "greaterworksparish04@gmail.com";

  // If already logged in as the allowed admin, skip straight to the dashboard
  auth.onAuthStateChanged((user) => {
    if (user && user.email && user.email.toLowerCase() === ALLOWED_ADMIN_EMAIL) {
      window.location.href = "admin-dashboard.html";
    }
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("errorBox");
    errorBox.style.display = "none";

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      if (cred.user.email.toLowerCase() !== ALLOWED_ADMIN_EMAIL) {
        await auth.signOut();
        errorBox.textContent = "This account is not authorized for this dashboard.";
        errorBox.style.display = "block";
        return;
      }
      window.location.href = "admin-dashboard.html";
    } catch (err) {
      errorBox.textContent = "Login failed — check your email and password.";
      errorBox.style.display = "block";
    }
  });
</script>
</body>
</html>
